<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        // noopener impide que la página abierta acceda a la ventana original mediante window.opener, mejorando la seguridad.
        function conNoopenerNoreferrer() {
            console.log(window.open('https://www.mozilla.org', "_blank", "noopener,noreferrer"));
        }
        function sinCaracteristicas() {
            console.log(window.open('https://www.mozilla.org', "_blank"));
        }
    </script>
</head>
<body>
    <button onclick="conNoopenerNoreferrer()">Con</button>
    <button onclick="sinCaracteristicas()">Sin</button>
</body>
</html>
