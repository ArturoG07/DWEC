    <title>Document</title>
    <script>
        if (-1 || 0) alert( "primero" ); // Se ejecuta ya que -1 se resuelve a true y hay un OR
        if (-1 && 0) alert( "segundo" ); // No se ejecuta ya que 0 se resuelve a false y hay un AND
        if (null || -1 && 1) alert( "tercero" ); // Se ejecuta ya que -1 y 1 se resuelven a true y estan dentro de un OR
    </script>
